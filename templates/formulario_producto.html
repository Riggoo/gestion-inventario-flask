<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Editar Producto' if producto else 'Nuevo Producto' }}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; text-align: center; }
        .form-container { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); text-align: left; width: 350px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-family: Arial, sans-serif; }
        textarea { resize: vertical; height: 80px; }
        .btn-submit { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-submit:hover { background-color: #0069d9; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>{{ 'Modificar Producto' if producto else 'Registrar Nuevo Producto' }}</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="nombre">Nombre del Producto:</label>
            <input type="text" id="nombre" name="nombre" value="{{ producto.nombre if producto else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion">{{ producto.descripcion if producto else '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="precio">Precio de Venta ($):</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0" value="{{ producto.precio if producto else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="stock">Cantidad Inicial en Stock:</label>
            <input type="number" id="stock" name="stock" min="0" value="{{ producto.stock if producto else '' }}" required>
        </div>
        
        <button type="submit" class="btn-submit">
            {{ 'Guardar Cambios' if producto else 'Agregar al Inventario' }}
        </button>
    </form>
    
    <a class="btn-cancel" href="/">Cancelar y volver</a>
</div>

</body>
</html>
